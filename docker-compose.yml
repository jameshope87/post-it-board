services:
  postit:
    build: .
    container_name: postit-board
    restart: unless-stopped
    init: true
    env_file: .env
    # Only listen on localhost - Apache is the only thing that can reach it.
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
